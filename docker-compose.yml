# Milvus for ultimate-ai-local-search: one container with embedded etcd and local storage,
# the setup of the official standalone_embed.sh. No MinIO container: its pinned image can no
# longer be pulled, and a single local index does not need object storage.
# Labels are intentional: they let you find/keep these and avoid nuking them by accident.
name: uals

services:
  milvus:
    container_name: uals-milvus
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.5.6}
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    configs:
      - source: embed_etcd
        target: /milvus/configs/embedEtcd.yaml
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 120s
      timeout: 20s
      retries: 5
    ports:
      # Only on loopback: Milvus has no auth, so 0.0.0.0 would open it to the LAN.
      # The embedded etcd (2379) stays inside the container.
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_PORT:-9091}:9091"
    labels:
      app: ultimate-ai-local-search
      do-not-delete: "uals vector-search stack"

configs:
  embed_etcd:
    content: |
      listen-client-urls: http://0.0.0.0:2379
      advertise-client-urls: http://0.0.0.0:2379
      quota-backend-bytes: 4294967296
      auto-compaction-mode: revision
      auto-compaction-retention: '1000'

volumes:
  milvus_data:
    labels: { app: ultimate-ai-local-search }

networks:
  default:
    name: uals-net
