name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,         os: macos-latest }
          - { target: x86_64-apple-darwin,          os: macos-latest }
          - { target: x86_64-unknown-linux-musl,    os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl,   os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build
        run: cargo build --release --locked -p uals --target "${{ matrix.target }}"

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package-release.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release/uals" "$TAG" dist

      - uses: actions/upload-artifact@v4
        with:
          name: uals-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release if missing and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
