name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  private:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private data in tracked files
        run: scripts/check-private.sh

  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install from source
        run: ./install.sh --yes --semantic semble --from-source
      - name: Install again (must change nothing)
        run: ./install.sh --yes --semantic semble --from-source
      - name: Doctor passes
        run: ~/.local/bin/uals doctor
      - name: Uninstall
        run: ./uninstall.sh --yes
      - name: The binary and the manifest are gone
        run: |
          test ! -e ~/.local/bin/uals
          test ! -e ~/.local/share/uals/install-manifest

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck (warnings and errors)
        run: shellcheck -x -S warning install.sh uninstall.sh scripts/*.sh scripts/lib/*.sh .githooks/pre-commit
