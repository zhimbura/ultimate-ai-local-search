<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Change with uals per task">
<title>Change with uals per task</title>
<style>
  .bg { fill: #ffffff; } .ink { fill: #1f2328; } .muted { fill: #59636e; } .grid { stroke: #d1d9e0; }
  .base { fill: #9aa4ae; } .uals { fill: #2f81f7; } .good { fill: #1a7f37; } .flat { fill: #9a6700; }
  .whisker { stroke: #1f2328; }
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; } .ink { fill: #e6edf3; } .muted { fill: #9198a1; } .grid { stroke: #3d444d; }
    .base { fill: #656c76; } .uals { fill: #4493f8; } .good { fill: #3fb950; } .flat { fill: #d29922; }
    .whisker { stroke: #e6edf3; }
  }
</style>
<rect class="bg" width="760" height="300" rx="8"/>
<text class="ink" x="20" y="30" font-size="17" font-weight="600">With uals, per task (mean, paired)</text>
<text class="muted" x="20" y="50" font-size="13">Change against the same tasks without uals; whiskers: 95% bootstrap confidence interval</text>
<line class="grid" x1="190.0" x2="190.0" y1="65" y2="275"/>
<text class="muted" x="190.0" y="291" font-size="11" text-anchor="middle">-80%</text>
